[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sensorfit"
version = "0.1.0"
description = "A Python tool for calibrating amperometric traces to H2O2 concentrations and performing curve fitting analysis"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}  # Update if different
authors = [
    {name = "SensorFit Contributors"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "matplotlib>=3.4.0",
    "PyQt5>=5.15.0",
    "openpyxl>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
]

[project.scripts]
sensorfit-calibrate = "sensorfit.calibration_cli:main"

[tool.setuptools]
packages = ["sensorfit"]

